<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <filter id="turbulenceNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" />
    </filter>
    <filter id="turbulenceNoiseHigh">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" />
    </filter>
    <filter id="staticNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" seed="2" />
    </filter>
  </defs>
  <rect width="256" height="256" fill="white" filter="url(#turbulenceNoise)" />
</svg>
